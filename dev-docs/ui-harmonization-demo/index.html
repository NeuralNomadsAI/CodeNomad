<title>CodeNomad — palette gallery</title>
<style>
* { box-sizing: border-box }
body { margin: 24px auto; padding: 0 20px; max-width: 1000px; background: #f3f3f0; color: #202329; font: 14px/1.5 system-ui, sans-serif }
h1 { font-size: 24px; margin-bottom: 8px }
h2 { font-size: 18px; margin: 24px 0 12px }
.palettes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px }
figure { margin: 0; min-width: 0 }
img { width: 100%; height: auto; display: block; border: 1px solid #c7c9c8 }
figcaption { margin-top: 4px; font-weight: 600 }
a { color: inherit }
a:focus-visible { outline: 3px solid #0080ff; outline-offset: 3px }
@media (max-width: 700px) { .palettes { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 450px) { .palettes { grid-template-columns: 1fr } }
</style>
