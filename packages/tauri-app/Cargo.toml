[workspace]
members = ["src-tauri", "tests/windows-input", "tests/macos-window", "tests/panel-extension"]
default-members = ["src-tauri"]
resolver = "2"

# Tao 0.34.x lacks Windows input reentrancy (tao#1215) and macOS
# read-only zoom detection (tao#1182) fixes.
# Keep the current Tauri API/dependency line; see vendor/README.md for provenance.
[patch.crates-io]
tao = { path = "vendor/tao-0.34.6" }
