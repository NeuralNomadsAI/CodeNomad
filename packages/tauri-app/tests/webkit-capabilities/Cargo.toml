[package]
name = "codenomad-webkit-capabilities-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "codenomad-webkit-capabilities-fixture"
path = "src/main.rs"
test = false

[dependencies]
tauri = { version = "2.12.5", features = ["unstable", "test"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"
