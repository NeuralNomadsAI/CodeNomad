[package]
name = "codenomad-rune-app"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "codenomad-rune"

[[bin]]
name = "codenomad-rune"
path = "src/main.rs"

[features]
default = []
test-support = ["rune-theme-codenomad/test-support"]

[dependencies]
base64 = "0.22"
async-lock = "3.5.0"
codenomad-client = { path = "../../crates/codenomad-client" }
percent-encoding = "2"
rune = { workspace = true }
rune-kit = { workspace = true, features = ["syntax"] }
rune-theme-codenomad = { workspace = true }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
icu_collator = "2.4.0"
icu_locale_core = "2.4.0"
sys-locale = "0.3.2"
codenomad-host-process = { path = "../../crates/codenomad-host-process" }
rune = { workspace = true, features = ["native-file-dialog"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["io-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rune = { workspace = true, features = ["webgl"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams", "Storage", "EventTarget", "PageTransitionEvent", "Request", "RequestInit", "RequestCredentials", "Clipboard", "Document", "Navigator", "HtmlElement", "HtmlTextAreaElement", "CssStyleDeclaration", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlInputElement", "File", "FileList", "Event", "Node", "Element", "MediaQueryList"] }
