[package]
name = "codenomad-rune-app"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "codenomad-rune"

[[bin]]
name = "codenomad-rune"
path = "src/main.rs"

[[example]]
name = "browser-notifications"
path = "tests/probes/notifications_web.rs"
crate-type = ["cdylib"]
required-features = ["test-support"]

# The Android library: the application itself, for Rune's Android host. Behind a feature so
# that no other build compiles the application a second time.
[[example]]
name = "android"
path = "src/main.rs"
crate-type = ["cdylib"]
required-features = ["android"]

[features]
default = []
android = []
test-support = ["rune-theme-codenomad/test-support"]

[dependencies]
base64 = "0.22"
async-lock = "3.5.0"
codenomad-client = { path = "../../crates/codenomad-client" }
percent-encoding = "2"
rune = { workspace = true }
rune-kit = { workspace = true, features = ["syntax"] }
rune-theme-codenomad = { workspace = true }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
icu_collator = "2.4.0"
icu_locale_core = "2.4.0"
sys-locale = "0.3.2"
codenomad-host-process = { path = "../../crates/codenomad-host-process" }
rune = { workspace = true, features = ["native-file-dialog"] }
codenomad-desktop-updater = { path = "../../crates/codenomad-desktop-updater" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["io-util"] }

[target.'cfg(target_os = "windows")'.dependencies]
codenomad-windows-notifications = { path = "../../crates/codenomad-windows-notifications" }
codenomad-windows-install = { path = "../../crates/codenomad-windows-install" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rune = { workspace = true, features = ["webgl"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams", "Storage", "EventTarget", "PageTransitionEvent", "Request", "RequestInit", "RequestCredentials", "Clipboard", "Document", "Navigator", "HtmlElement", "HtmlTextAreaElement", "CssStyleDeclaration", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlInputElement", "File", "FileList", "Event", "Node", "Element", "MediaQueryList", "Notification", "NotificationOptions", "NotificationPermission", "VisibilityState"] }

# Evaluated against the host: the resource compiler only exists on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
