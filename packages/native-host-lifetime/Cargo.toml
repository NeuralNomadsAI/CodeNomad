[package]
name = "codenomad-native-host-lifetime"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Isolated Job/Node fixtures only; never enable this in desktop packaging.
fixtures = []

[[bin]]
name = "host-lifetime-fixture"
path = "src/bin/fixture.rs"
required-features = ["fixtures"]

[[bin]]
name = "codenomad-host-supervisor"
path = "src/bin/supervisor.rs"

[target.'cfg(windows)'.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
