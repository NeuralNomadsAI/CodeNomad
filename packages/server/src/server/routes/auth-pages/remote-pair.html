<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>CodeNomad</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        background: #0b0b0f;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        width: 420px;
        max-width: calc(100vw - 32px);
        background: #14141c;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.7);
        font-size: 13px;
        line-height: 1.4;
      }
      .error {
        margin-top: 12px;
        color: #ff6b6b;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">Pairing this device…</h1>
      <p id="message">Connecting to CodeNomad.</p>
      <div id="error" class="error" style="display: none"></div>
    </div>

    <script>
      const code = (location.hash || "").replace(/^#/, "").trim()
      // Remove the single-use code from the address bar and history.
      history.replaceState(null, "", location.pathname)
      const title = document.getElementById("title")
      const message = document.getElementById("message")
      const errorEl = document.getElementById("error")
      const showError = (text) => {
        errorEl.textContent = text
        errorEl.style.display = "block"
      }

      async function run() {
        if (!code) {
          title.textContent = "This device is not paired"
          message.textContent = "On the CodeNomad host, open Settings → Remote Access, create a new pairing link and open it on this device."
          return
        }

        try {
          const res = await fetch("/api/remote-control/pair", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code }),
            credentials: "same-origin",
          })
          if (!res.ok) {
            let text = ""
            try {
              const json = await res.json()
              text = json && json.error ? String(json.error) : ""
            } catch {
              text = ""
            }
            title.textContent = "Pairing failed"
            message.textContent = "Create a new pairing link on the CodeNomad host."
            showError(text || `Pairing failed (${res.status})`)
            return
          }
          window.location.replace("/")
        } catch (e) {
          title.textContent = "Pairing failed"
          showError(e && e.message ? e.message : String(e))
        }
      }

      run()
    </script>
  </body>
</html>
