version: 2
updates:
  # Every Rust dependency of the Tauri workspace (dev-docs/RUNTIME_MAINTENANCE.md),
  # from the Cargo workspace root holding Cargo.lock. No `allow` list: it would
  # also filter security updates. Security fixes arrive in one grouped PR. Version
  # updates group the Tauri family (whose runtime crates are direct dependencies
  # of the runtime regression fixture) apart from the other crates; minor and
  # patch updates arrive together, each major in its own PR. Vendored Tao and
  # updater copies are path patches that Dependabot leaves alone; an update
  # needing newer ones fails the vendored-patch check until re-vendored
  # (packages/tauri-app/vendor/README.md).
  - package-ecosystem: cargo
    directory: /packages/tauri-app
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
      tauri:
        patterns:
          - tauri
          - tauri-*
          - wry
        update-types:
          - minor
          - patch
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Every npm dependency of the workspaces (dev-docs/RUNTIME_MAINTENANCE.md); the
  # root entry covers the workspace manifests and the root lockfile. No `allow`
  # list: it would also filter security updates. Security fixes arrive in one
  # grouped PR. Version updates group the Electron toolchain, the Tauri
  # JavaScript packages and the other dependencies apart; minor and patch updates
  # arrive together per group, each major in its own PR.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      electron-toolchain:
        patterns:
          - electron
          - electron-builder
          - electron-vite
        update-types:
          - minor
          - patch
      tauri-js:
        patterns:
          - "@tauri-apps/*"
        update-types:
          - minor
          - patch
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
