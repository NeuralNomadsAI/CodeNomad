version: 2
updates:
  # Only the Tauri family (dev-docs/RUNTIME_MAINTENANCE.md), from the Cargo
  # workspace root holding Cargo.lock. The runtime crates are direct dependencies
  # of the runtime regression fixture, whose requirements follow; Wry is a
  # lockfile-only update. Vendored Tao and updater copies are path patches that Dependabot leaves alone;
  # an update needing newer ones fails the vendored-patch check until re-vendored
  # (packages/tauri-app/vendor/README.md). Minor and patch updates arrive
  # together; each major update gets its own PR.
  - package-ecosystem: cargo
    directory: /packages/tauri-app
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-name: tauri
      - dependency-name: tauri-build
      - dependency-name: tauri-plugin-*
      - dependency-name: tauri-runtime*
      - dependency-name: wry
        dependency-type: indirect
    groups:
      tauri:
        patterns:
          - tauri
          - tauri-*
          - wry
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Only the Electron toolchain and the Tauri JavaScript packages
  # (dev-docs/RUNTIME_MAINTENANCE.md). The root entry covers the workspace
  # manifests and the root lockfile. Minor and patch updates arrive together per
  # toolchain; each major update gets its own PR.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    allow:
      - dependency-name: electron
      - dependency-name: electron-builder
      - dependency-name: electron-vite
      - dependency-name: "@tauri-apps/*"
    groups:
      electron-toolchain:
        patterns:
          - electron
          - electron-builder
          - electron-vite
        update-types:
          - minor
          - patch
      tauri-js:
        patterns:
          - "@tauri-apps/*"
        update-types:
          - minor
          - patch
