name: Rune native and web foundations

on:
  workflow_dispatch:
  pull_request:
    branches: [feat/rust-server]
    paths:
      - 'Cargo.*'
      - 'packages/rune-app/**'
      - 'packages/server-rs/**'
      - 'packages/server/src/server/routes/auth-pages/**'
      - 'crates/**'
      - 'scripts/rune/**'
      - 'scripts/native-fixture-*'
      - 'scripts/native-product-fixture.mjs'
      - 'scripts/perf/**'
      - 'packages/ui/src/**'
      - 'packages/ui/tests/**'
      - '.github/workflows/rune-native.yml'
      - 'package*.json'
  push:
    branches: [feat/rust-server, 'rune/*']

permissions:
  contents: read

concurrency:
  group: rune-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/feat/rust-server' }}

jobs:
  headless:
    name: Headless Rune (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/rune-ci
      CARGO_INCREMENTAL: '0'
      CODENOMAD_PROFILE: trial-rune-ci
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Linux offscreen graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers libvulkan1 nasm
      - name: Windows AVIF assembler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
            Add-Content -LiteralPath $env:GITHUB_PATH -Value 'C:\Program Files\NASM'
          }
      - name: macOS x86 AVIF assembler
        if: runner.os == 'macOS'
        run: |
          if [[ "$(uname -m)" == x86_64 ]] && ! command -v nasm >/dev/null; then brew install nasm; fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install generator browser
        id: setup_env
        run: npx --workspace @codenomad/ui playwright install --with-deps chromium
      - name: Restore trusted Cargo downloads
        id: cargo_cache
        if: ${{ hashFiles('.github/actions/download-cache/action.yml') != '' }}
        uses: ./.github/actions/download-cache
        with:
          kind: cargo
      - name: Check generated source and component inventory
        run: |
          node scripts/rune/generate-theme.mjs --check
          node scripts/rune/generate-palettes.mjs --check
          node scripts/rune/generate-catalogues.mjs --check
          node scripts/rune/generate-hotkeys.mjs --check
          node scripts/rune/component-inventory.mjs --check
          node --test scripts/rune/*.test.mjs
          node --test scripts/perf/*.test.mjs
      - name: Check Rust formatting, lints and style policy
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' && steps.cargo_cache.outcome != 'failure' }}
        run: |
          cargo fmt -p codenomad-rune-app -p codenomad-client -p rune-theme-codenomad -p codenomad-host-process -p rune-style-policy -p codenomad-windows-notifications -p codenomad-windows-install -- --check
          cargo fmt --manifest-path packages/server-rs/Cargo.toml -- --check
          cargo clippy --locked -p codenomad-client -p codenomad-rune-app -- -D clippy::correctness -D clippy::suspicious
          cargo clippy --locked --manifest-path packages/server-rs/Cargo.toml -- -D clippy::correctness -D clippy::suspicious
          cargo run --locked -p rune-style-policy -- packages/rune-app/src
      - name: Run Rust workspace tests
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' && steps.cargo_cache.outcome != 'failure' }}
        run: |
          cargo test --locked --workspace
      - name: Build native Rune and fixture binaries
        id: build_native
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' && steps.cargo_cache.outcome != 'failure' }}
        run: |
          cargo build --locked -p codenomad-rune-app --bin codenomad-rune
          cargo build --locked -p codenomad-host-process --bin codenomad-fixture-job
      - name: Run Node fixture guard and diagnostic tests
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        run: |
          node --test scripts/native-fixture-guards.test.mjs
          node --test scripts/native-fixture-cold-diagnostics.test.mjs
          node --test packages/rune-app/fixtures/*.test.mjs
      - name: Build shared client, state and views for WebAssembly
        id: build_wasm
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' && steps.cargo_cache.outcome != 'failure' }}
        run: |
          cargo build --locked --target wasm32-unknown-unknown -p codenomad-client -p rune-theme-codenomad
          cargo build --locked --target wasm32-unknown-unknown -p codenomad-rune-app --bin codenomad-rune
      - name: Run Rust server unit tests
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' && steps.cargo_cache.outcome != 'failure' }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Windows defaults TMP/TEMP under the user profile, which serve.rs rejects.
            win_temp="$(cygpath -w "$RUNNER_TEMP")"
            TMP="$win_temp" TEMP="$win_temp" cargo test --locked --manifest-path packages/server-rs/Cargo.toml
          else
            cargo test --locked --manifest-path packages/server-rs/Cargo.toml
          fi
      - name: Verify default product excludes qualification probes
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' && steps.build_wasm.outcome == 'success' }}
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          node scripts/rune/check-production.mjs --binary "$CARGO_TARGET_DIR/debug/codenomad-rune$suffix" --wasm "$CARGO_TARGET_DIR/wasm32-unknown-unknown/debug/codenomad-rune.wasm" --out "target/rune-evidence/$RUNNER_OS/production"
      - name: Build explicit qualification support
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        run: |
          cargo build --locked -p codenomad-rune-app --bin codenomad-rune --features test-support
          cargo test --locked -p codenomad-rune-app --features test-support only_character_ink
          cargo test --locked -p codenomad-rune-app --features test-support probes::git_panel::tests::
          cargo build --locked --target wasm32-unknown-unknown -p codenomad-rune-app --bin codenomad-rune --features test-support
      - name: Inspect and interact through Rune offscreen tooling
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          node scripts/rune/headless.mjs --binary "$CARGO_TARGET_DIR/debug/codenomad-rune$suffix" --out "target/rune-evidence/$RUNNER_OS"
          node scripts/rune/parity/action-menu-native.mjs --binary "$CARGO_TARGET_DIR/debug/codenomad-rune$suffix"
          cargo build --locked -p rune-theme-codenomad --example workspace-tree-row
          node scripts/rune/parity/workspace-tree-row-native.mjs --binary "$CARGO_TARGET_DIR/debug/examples/workspace-tree-row$suffix"
      - name: Qualify restoration through the shared Rust server
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        run: |
          cargo build --locked --manifest-path packages/server-rs/Cargo.toml
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then
            suffix='.exe'
          fi
          export RUNE_CLIENT_EXE="$CARGO_TARGET_DIR/debug/codenomad-rune$suffix"
          export RUNE_SERVER_EXE="$CARGO_TARGET_DIR/debug/codenomad-rs$suffix"
          node packages/rune-app/fixtures/launcher-fixture.mjs --workspace-claims
          node packages/rune-app/fixtures/launcher-fixture.mjs --restore-state
          node packages/rune-app/fixtures/launcher-fixture.mjs --files-state --document-state
          if [[ "$RUNNER_OS" == Windows ]]; then node packages/rune-app/fixtures/launcher-fixture.mjs --git-panel; fi
          node packages/rune-app/fixtures/files-fixture.mjs
          node packages/rune-app/fixtures/files-fixture.mjs --write
          node packages/rune-app/fixtures/recovery-fixture.mjs
          node packages/rune-app/fixtures/recovery-fixture.mjs --suspend
          if [[ "$RUNNER_OS" == Windows ]]; then
            node packages/rune-app/fixtures/launcher-fixture.mjs --git-panel --place-worktree
            node packages/rune-app/fixtures/launcher-fixture.mjs --git-panel --place-worktree --placement-ambiguity
            node packages/rune-app/fixtures/launcher-fixture.mjs --git-panel --place-worktree --placement-busy
          fi
      - name: Compare shared controls with Solid on Windows
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build_native.outcome == 'success' }}
        run: |
          node scripts/rune/component-inventory.mjs
          node --import tsx scripts/rune/parity/window-close.mjs --binary "$CARGO_TARGET_DIR/debug/codenomad-rune.exe"
          node scripts/rune/parity/compare-window-close.mjs
          node --import tsx scripts/rune/parity/preferences.mjs --binary "$CARGO_TARGET_DIR/debug/codenomad-rune.exe"
          node scripts/rune/parity/action-menu.mjs
          cp target/rune-inventory/components__action-overflow-menu.json target/rune-parity/action-menu/source-sheet.json
          node scripts/rune/parity/compare-action-menu.mjs --thresholds scripts/rune/parity/action-menu-thresholds.json
          node scripts/rune/parity/workspace-tree-row.mjs
          cp target/rune-inventory/components__instance__shell__right-panel__components__WorkspaceTree.json target/rune-parity/workspace-tree-row/source-sheet.json
          node scripts/rune/parity/compare-workspace-tree-row.mjs --thresholds scripts/rune/parity/workspace-tree-row-thresholds.json
      - name: Record qualification scope
        if: always()
        run: |
          echo '### Rune qualification' >> "$GITHUB_STEP_SUMMARY"
          echo 'Runtime tests, generated-source checks and offscreen accessibility/interaction/capture checks run on this OS. Read individual step outcomes and uploaded evidence.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Windows additionally compares the shared window-close control, short action-menu popup states and twenty workspace-row cases with actual Solid captures using committed regional thresholds. Complete menu/tree callers, other component/platform pairs and Rune/TUI latency collection remain to qualify. Headless virtual-clock frame timing is separate from measured interactive latency.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rune-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/rune-evidence/${{ runner.os }}/
            target/rune-parity/window-close/
            target/rune-parity/preferences/
            target/rune-parity/action-menu/
            target/rune-parity/workspace-tree-row/
            target/rune-action-menu/
            packages/rune-app/fixture-profile/**/proof.json
            target/rune-files-tests/**/proof.json
          if-no-files-found: warn
          retention-days: 7
