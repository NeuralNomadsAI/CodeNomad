name: Build and Upload Binaries

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to build from"
        required: false
        default: ""
        type: string
      version:
        description: "Version to apply to workspace packages (release builds)"
        required: false
        default: ""
        type: string
      tag:
        description: "Git tag to upload assets to (release builds)"
        required: false
        default: ""
        type: string
      release_name:
        description: "Release name (unused here, for context)"
        required: false
        default: ""
        type: string
      upload:
        description: "Upload built artifacts to the GitHub release"
        required: false
        default: true
        type: boolean
      upload_actions_artifacts:
        description: "Upload built artifacts to GitHub Actions run artifacts"
        required: false
        default: false
        type: boolean
      actions_artifacts_retention_days:
        description: "Retention (days) for GitHub Actions artifacts"
        required: false
        default: 7
        type: number
      actions_artifacts_name_prefix:
        description: "Optional prefix for Actions artifact names"
        required: false
        default: ""
        type: string
      set_versions:
        description: "Run npm version to set workspace versions"
        required: false
        default: true
        type: boolean

# Permissions are intentionally omitted here so callers can choose
# least-privilege (e.g. dev CI uses read-only; releases grant write).

jobs:
  build-macos:
    runs-on: macos-15-intel
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set workspace versions
        if: ${{ inputs.set_versions && inputs.version != '' }}
        shell: bash
        env:
          NPM_CONFIG_FETCH_RETRIES: 5
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 20000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm version "${VERSION}" --workspaces --include-workspace-root --no-git-tag-version --allow-same-version; then
              exit 0
            fi
            echo "npm version failed (attempt $attempt/3); retrying..." >&2
            sleep $((attempt * 10))
          done
          exit 1

      - name: Install dependencies
        run: npm ci --workspaces --include=optional

      - name: Build macOS binaries (Electron)
        run: npm run build:mac --workspace @neuralnomads/codenomad-electron-app

      - name: Verify bundled Node resource (Electron macOS)
        run: node scripts/verify-bundled-node.cjs packages/electron-app/release/mac/CodeNomad.app/Contents/Resources@darwin-x64 packages/electron-app/release/mac-arm64/CodeNomad.app/Contents/Resources@darwin-arm64

      - name: Ad-hoc sign Electron macOS app bundles (seal resources)
        shell: bash
        run: |
          set -euo pipefail

          release_root="packages/electron-app/release"
          apps=()
          while IFS= read -r -d '' app; do
            apps+=("$app")
          done < <(find "$release_root" -type d -name 'CodeNomad.app' -print0)

          if [ "${#apps[@]}" -eq 0 ]; then
            echo "No CodeNomad.app found under $release_root" >&2
            exit 1
          fi

          # GitHub macOS runners typically have no signing identity. Without any signature,
          # the shipped .app can fail Gatekeeper with:
          #   code has no resources but signature indicates they must be present
          # Ad-hoc signing seals bundle resources and makes the signature internally consistent.
          if security find-identity -p codesigning -v | grep -q "0 valid identities found"; then
            echo "No valid macOS codesigning identity found; applying ad-hoc signature"
            for app in "${apps[@]}"; do
              echo "codesign (adhoc): $app"
              codesign --force --deep --sign - "$app"
              codesign --verify --deep --strict --verbose=2 "$app"
            done
          else
            echo "macOS codesigning identity present; skipping ad-hoc signing"
          fi

      - name: Repackage Electron macOS zips (ditto)
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the workflow-provided version; fall back to package.json.
          VERSION_TO_USE="${VERSION:-}"
          if [ -z "$VERSION_TO_USE" ]; then
            VERSION_TO_USE=$(node -p "require('./packages/electron-app/package.json').version")
          fi

          release_root="packages/electron-app/release"
          # macOS GitHub runners ship /bin/bash 3.2 which doesn't support `shopt -s globstar`.
          # Use find to locate built app bundles instead of ** globs.
          apps=()
          while IFS= read -r -d '' app; do
            apps+=("$app")
          done < <(find "$release_root" -type d -name 'CodeNomad.app' -print0)
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "No CodeNomad.app found under $release_root" >&2
            exit 1
          fi

          for app in "${apps[@]}"; do
            bundle_dir=$(basename "$(dirname "$app")")
            arch="x64"
            if [[ "$bundle_dir" == *"arm64"* ]]; then
              arch="arm64"
            fi

            out_zip="$release_root/CodeNomad-Electron-macos-${arch}-${VERSION_TO_USE}.zip"
            rm -f "$out_zip"
            echo "ditto -ck: $app -> $out_zip"
            ditto -ck --sequesterRsrc --keepParent "$app" "$out_zip"
          done

      - name: Validate Electron macOS codesign (unzipped)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT

          zips=(packages/electron-app/release/CodeNomad-Electron-macos-*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "No Electron macOS zip artifacts found to validate" >&2
            exit 1
          fi

          for zip in "${zips[@]}"; do
            echo "Validating codesign for: $zip"
            extract_dir="$tmp_dir/$(basename "$zip" .zip)"
            mkdir -p "$extract_dir"

            # Use ditto for extraction as well to preserve bundle metadata.
            ditto -x -k "$zip" "$extract_dir"

            app_path=""
            for candidate in "$extract_dir"/*.app "$extract_dir"/*/*.app; do
              if [ -d "$candidate" ]; then
                app_path="$candidate"
                break
              fi
            done

            if [ -z "$app_path" ]; then
              echo "No .app found after extracting $zip" >&2
              exit 1
            fi

            codesign --verify --deep --strict --verbose=2 "$app_path"
          done

      - name: Upload release assets
        if: ${{ inputs.upload && inputs.tag != '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in packages/electron-app/release/*.zip packages/electron-app/release/*.AppImage; do
            [ -f "$file" ] || continue
            echo "Uploading $file"
            gh release upload "$TAG" "$file" --clobber
          done

      - name: Upload Actions artifacts (Electron macOS)
        if: ${{ inputs.upload_actions_artifacts }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.actions_artifacts_name_prefix }}electron-macos
          path: packages/electron-app/release/*.zip
          retention-days: ${{ inputs.actions_artifacts_retention_days }}
          if-no-files-found: error

  build-windows:
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set workspace versions
        if: ${{ inputs.set_versions && inputs.version != '' }}
        run: npm version ${{ env.VERSION }} --workspaces --include-workspace-root --no-git-tag-version --allow-same-version
        shell: bash

      - name: Install dependencies
        run: npm ci --workspaces --include=optional

      - name: Build Windows binaries (Electron)
        run: npm run build:win --workspace @neuralnomads/codenomad-electron-app

      - name: Verify bundled Node resource (Electron Windows)
        run: node scripts/verify-bundled-node.cjs packages/electron-app/electron/resources@win32-x64

      - name: Upload release assets
        if: ${{ inputs.upload && inputs.tag != '' }}
        shell: pwsh
        run: |
          Get-ChildItem -Path "packages/electron-app/release" -Filter *.zip -File | ForEach-Object {
            Write-Host "Uploading $($_.FullName)"
            gh release upload $env:TAG $_.FullName --clobber
          }

      - name: Upload Actions artifacts (Electron Windows)
        if: ${{ inputs.upload_actions_artifacts }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.actions_artifacts_name_prefix }}electron-windows
          path: packages/electron-app/release/*.zip
          retention-days: ${{ inputs.actions_artifacts_retention_days }}
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set workspace versions
        if: ${{ inputs.set_versions && inputs.version != '' }}
        run: npm version ${VERSION} --workspaces --include-workspace-root --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci --workspaces --include=optional

      - name: Build Linux binaries (Electron)
        run: npm run build:linux --workspace @neuralnomads/codenomad-electron-app

      - name: Verify bundled Node resource (Electron Linux)
        run: node scripts/verify-bundled-node.cjs packages/electron-app/electron/resources@linux-x64

      # The deb installs as root, so its post-install script can give Chromium's
      # sandbox helper the root ownership and 4755 mode a user archive cannot.
      - name: Package and verify Electron deb
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION_TO_USE="${VERSION:-}"
          if [ -z "$VERSION_TO_USE" ]; then
            VERSION_TO_USE=$(node -p "require('./packages/electron-app/package.json').version")
          fi
          debs=(packages/electron-app/release/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "Expected one Electron Linux deb, found ${#debs[@]}" >&2
            exit 1
          fi

          # electron-builder names deb architectures the Debian way (amd64).
          artifact="packages/electron-app/release/CodeNomad-Electron-linux-x64-${VERSION_TO_USE}.deb"
          if [ "${debs[0]}" != "$artifact" ]; then
            mv "${debs[0]}" "$artifact"
          fi
          # electron-builder writes prerelease dashes as "~", which dpkg sorts before
          # the release. Dev builds (<stable>-dev-<date>-<sha>) follow their stable
          # base, so they become <stable>+dev.<date>.<sha> to install as upgrades.
          case "$VERSION_TO_USE" in
            *-dev-*) debian_version="${VERSION_TO_USE%%-dev-*}+dev.$(printf '%s' "${VERSION_TO_USE#*-dev-}" | tr - .)" ;;
            *) debian_version=$(printf '%s' "$VERSION_TO_USE" | tr - '~') ;;
          esac
          if [ "$(dpkg-deb --field "$artifact" Version)" != "$debian_version" ]; then
            repack_dir=$(mktemp -d)
            dpkg-deb --raw-extract "$artifact" "$repack_dir"
            sed -i "s/^Version: .*/Version: $debian_version/" "$repack_dir/DEBIAN/control"
            dpkg-deb --root-owner-group -Zxz --build "$repack_dir" "$artifact"
            rm -rf "$repack_dir"
          fi
          dpkg-deb --info "$artifact"
          for field in Package:codenomad Conflicts:code-nomad Replaces:code-nomad "Version:$debian_version"; do
            if [ "$(dpkg-deb --field "$artifact" "${field%%:*}")" != "${field#*:}" ]; then
              echo "Electron deb ${field%%:*} must be ${field#*:}" >&2
              exit 1
            fi
          done

          extract_dir=$(mktemp -d)
          trap 'rm -rf "$extract_dir"' EXIT
          dpkg-deb --extract "$artifact" "$extract_dir"
          dpkg-deb --control "$artifact" "$extract_dir/DEBIAN"
          grep -Fq "chmod 4755 '/opt/CodeNomad/chrome-sandbox'" "$extract_dir/DEBIAN/postinst"

          binary="$extract_dir/opt/CodeNomad/CodeNomad"
          for required in "$binary" "$extract_dir/opt/CodeNomad/chrome-sandbox" "$extract_dir/usr/share/applications/CodeNomad.desktop"; do
            if [ ! -e "$required" ]; then
              echo "Missing path in Electron deb: ${required#"$extract_dir"}" >&2
              exit 1
            fi
          done
          if [ ! -x "$binary" ]; then
            echo "Electron deb does not contain an executable CodeNomad binary" >&2
            exit 1
          fi

          resources_dir="$(dirname "$binary")/resources"
          node scripts/smoke-packaged-resources.cjs \
            --resources "$resources_dir" \
            --target linux-x64

          app_asar="$resources_dir/app.asar"
          if [ ! -f "$app_asar" ]; then
            echo "Electron deb does not contain resources/app.asar" >&2
            exit 1
          fi
          node - "$app_asar" <<'NODE'
          const asar = require("@electron/asar")
          const path = require("node:path")
          const archive = process.argv[2]
          const files = asar.listPackage(archive).map((file) =>
            file.replace(/^[/\\]/, "").replaceAll("\\", "/"),
          )
          const fileSet = new Set(files)
          const loadingPath = "dist/renderer/loading.html"
          if (!fileSet.has(loadingPath)) {
            throw new Error("Electron app.asar is missing dist/renderer/loading.html")
          }
          if (!files.some((file) => file.startsWith("dist/renderer/assets/") && !file.endsWith("/"))) {
            throw new Error("Electron app.asar does not contain renderer assets")
          }
          const html = asar.extractFile(archive, loadingPath).toString("utf8")
          for (const match of html.matchAll(/\b(?:src|href)=["']([^"']+)["']/g)) {
            const reference = match[1]
            if (/^(?:[a-z]+:|#)/i.test(reference)) continue
            const cleanReference = reference.split(/[?#]/, 1)[0]
            const target = cleanReference.startsWith("/")
              ? cleanReference.slice(1)
              : path.posix.normalize(path.posix.join(path.posix.dirname(loadingPath), cleanReference))
            if (!fileSet.has(target)) {
              throw new Error(`Electron app.asar is missing renderer reference ${target}`)
            }
          }
          NODE

          ldd "$binary" | tee /tmp/codenomad-electron-ldd.txt
          if grep -q "not found" /tmp/codenomad-electron-ldd.txt; then
            echo "Electron deb binary has unresolved shared libraries" >&2
            exit 1
          fi

      # Installs over a stand-in for the previous Tauri deb (package code-nomad),
      # which shipped the same desktop entry, so upgrading users are not blocked.
      - name: Verify Electron deb installation on Ubuntu 24.04
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(packages/electron-app/release/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "Expected one packaged Electron deb, found ${#debs[@]}" >&2
            exit 1
          fi

          artifact=$(realpath "${debs[0]}")
          docker run --rm \
            --volume "$artifact:/tmp/codenomad.deb:ro" \
            ubuntu:24.04 \
            bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              mkdir -p /tmp/previous/DEBIAN /tmp/previous/usr/share/applications
              printf "%s\n" "Package: code-nomad" "Version: 0.20.1" "Architecture: amd64" \
                "Maintainer: CodeNomad <ci@example.invalid>" "Description: previous Tauri deb" \
                > /tmp/previous/DEBIAN/control
              printf "[Desktop Entry]\nName=CodeNomad\n" > /tmp/previous/usr/share/applications/CodeNomad.desktop
              dpkg-deb --build /tmp/previous /tmp/previous.deb >/dev/null
              dpkg -i /tmp/previous.deb >/dev/null

              apt-get update >/dev/null
              # Without recommends, ldd below proves the declared Depends suffice.
              apt-get install -y --no-install-recommends /tmp/codenomad.deb >/dev/null
              if dpkg-query -W -f "\${Status}" code-nomad 2>/dev/null | grep -q "install ok installed"; then
                echo "The Electron deb did not replace the previous Tauri deb" >&2
                exit 1
              fi
              test "$(dpkg-query -S /usr/share/applications/CodeNomad.desktop)" = "codenomad: /usr/share/applications/CodeNomad.desktop"
              test -x /opt/CodeNomad/CodeNomad
              test -x /usr/bin/CodeNomad
              # Chromium refuses to start unless its setuid sandbox helper is root-owned 4755.
              test "$(stat -c "%U:%G %a" /opt/CodeNomad/chrome-sandbox)" = "root:root 4755"
              ldd /opt/CodeNomad/CodeNomad | tee /tmp/codenomad-electron-ldd.txt
              ! grep -q "not found" /tmp/codenomad-electron-ldd.txt
            '

      - name: Upload release assets
        if: ${{ inputs.upload && inputs.tag != '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(packages/electron-app/release/*.deb)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected one Electron Linux release asset, found ${#files[@]}" >&2
            exit 1
          fi

          file="${files[0]}"
          asset_name=$(basename "$file")
          echo "Uploading $file"
          gh release upload "$TAG" "$file" --clobber
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq -- "$asset_name"; then
            echo "Uploaded Electron Linux asset is missing from release: $asset_name" >&2
            exit 1
          fi

          gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            case "$asset" in
              CodeNomad-Electron-linux-*.tar.gz|CodeNomad-Electron-linux-*.zip|CodeNomad-Electron-linux-*.AppImage|CodeNomad-Electron-linux-*.flatpak)
                echo "Deleting obsolete Linux asset $asset"
                gh release delete-asset "$TAG" "$asset" --yes
                ;;
            esac
          done

      - name: Upload Actions artifacts (Electron Linux)
        if: ${{ inputs.upload_actions_artifacts }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.actions_artifacts_name_prefix }}electron-linux
          path: packages/electron-app/release/*.deb
          retention-days: ${{ inputs.actions_artifacts_retention_days }}
          if-no-files-found: error

  build-tauri-macos:
    runs-on: macos-15-intel
    env:
      TAURI_UPDATER_PUBKEY: ${{ inputs.upload && inputs.tag != '' && secrets.TAURI_UPDATER_PUBKEY || '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable

      - name: Set workspace versions
        if: ${{ inputs.set_versions && inputs.version != '' }}
        run: npm version ${VERSION} --workspaces --include-workspace-root --no-git-tag-version --allow-same-version

      - name: Sync Tauri package version
        run: npm run sync:version --workspace @codenomad/tauri-app

      - name: Install dependencies
        run: npm ci --workspaces --include=optional

      - name: Prebuild (Tauri)
        run: npm run prebuild --workspace @codenomad/tauri-app

      - name: Verify bundled Node resource (Tauri macOS x64)
        run: node scripts/verify-bundled-node.cjs packages/tauri-app/src-tauri/resources@darwin-x64

      - name: Configure Tauri updater (macOS x64)
        run: npm run configure:updater --workspace @codenomad/tauri-app

      - name: Build macOS bundle (Tauri)
        working-directory: packages/tauri-app
        env:
          # Only this step holds the private key. Prebuild already ran without it,
          # so tauri.prebuilt.conf.json replaces the hook; cargo build scripts still see it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.upload && inputs.tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.upload && inputs.tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: npm exec -- tauri build --config src-tauri/tauri.prebuilt.conf.json

      - name: Package Tauri artifacts (macOS)
        if: ${{ inputs.upload || inputs.upload_actions_artifacts }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="packages/tauri-app/target/release/bundle"
          ARTIFACT_DIR="packages/tauri-app/release-tauri"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          if [ -d "$BUNDLE_ROOT/macos/CodeNomad.app" ]; then
            ditto -ck --sequesterRsrc --keepParent "$BUNDLE_ROOT/macos/CodeNomad.app" "$ARTIFACT_DIR/CodeNomad-Tauri-macos-x64-${VERSION}.zip"
          fi

      - name: Stage and publish signed updater (macOS x64)
        env:
          UPDATER_UPLOAD: ${{ inputs.upload && inputs.tag != '' }}
        run: node packages/tauri-app/scripts/updater-artifacts.mjs stage darwin-x86_64

      - name: Retain updater publication receipt (macOS x64)
        # Only release uploads publish a manifest; PR runs keep no receipt artifacts.
        if: ${{ inputs.upload && inputs.tag != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: updater-${{ github.run_id }}-darwin-x86_64
          overwrite: true
          path: packages/tauri-app/release-updater/darwin-x86_64.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Actions artifacts (Tauri macOS)
        if: ${{ inputs.upload_actions_artifacts }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.actions_artifacts_name_prefix }}tauri-macos
          path: packages/tauri-app/release-tauri/*.zip
          retention-days: ${{ inputs.actions_artifacts_retention_days }}
          if-no-files-found: warn

      - name: Upload Tauri release assets (macOS)
        if: ${{ inputs.upload && inputs.tag != '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in packages/tauri-app/release-tauri/*.zip; do
            [ -f "$file" ] || continue
            echo "Uploading $file"
            gh release upload "$TAG" "$file" --clobber
          done

  build-tauri-macos-arm64:
    runs-on: macos-26
    env:
      TAURI_UPDATER_PUBKEY: ${{ inputs.upload && inputs.tag != '' && secrets.TAURI_UPDATER_PUBKEY || '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable

      - name: Set workspace versions
        if: ${{ inputs.set_versions && inputs.version != '' }}
        run: npm version ${VERSION} --workspaces --include-workspace-root --no-git-tag-version --allow-same-version

      - name: Sync Tauri package version
        run: npm run sync:version --workspace @codenomad/tauri-app

      - name: Install dependencies
        run: npm ci --workspaces --include=optional

      - name: Prebuild (Tauri)
        run: npm run prebuild --workspace @codenomad/tauri-app

      - name: Verify bundled Node resource (Tauri macOS arm64)
        run: node scripts/verify-bundled-node.cjs packages/tauri-app/src-tauri/resources@darwin-arm64

      - name: Configure Tauri updater (macOS arm64)
        run: npm run configure:updater --workspace @codenomad/tauri-app

      - name: Build macOS bundle (Tauri, arm64)
        working-directory: packages/tauri-app
        env:
          # Only this step holds the private key. Prebuild already ran without it,
          # so tauri.prebuilt.conf.json replaces the hook; cargo build scripts still see it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.upload && inputs.tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.upload && inputs.tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: npm exec -- tauri build --config src-tauri/tauri.prebuilt.conf.json

      - name: Package Tauri artifacts (macOS arm64)
        if: ${{ inputs.upload || inputs.upload_actions_artifacts }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="packages/tauri-app/target/release/bundle"
          ARTIFACT_DIR="packages/tauri-app/release-tauri"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          if [ -d "$BUNDLE_ROOT/macos/CodeNomad.app" ]; then
            ditto -ck --sequesterRsrc --keepParent "$BUNDLE_ROOT/macos/CodeNomad.app" "$ARTIFACT_DIR/CodeNomad-Tauri-macos-arm64-${VERSION}.zip"
          fi

      - name: Stage and publish signed updater (macOS arm64)
        env:
          UPDATER_UPLOAD: ${{ inputs.upload && inputs.tag != '' }}
        run: node packages/tauri-app/scripts/updater-artifacts.mjs stage darwin-aarch64

      - name: Retain updater publication receipt (macOS arm64)
        # Only release uploads publish a manifest; PR runs keep no receipt artifacts.
        if: ${{ inputs.upload && inputs.tag != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: updater-${{ github.run_id }}-darwin-aarch64
          overwrite: true
          path: packages/tauri-app/release-updater/darwin-aarch64.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Actions artifacts (Tauri macOS arm64)
        if: ${{ inputs.upload_actions_artifacts }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.actions_artifacts_name_prefix }}tauri-macos-arm64
          path: packages/tauri-app/release-tauri/*.zip
          retention-days: ${{ inputs.actions_artifacts_retention_days }}
          if-no-files-found: warn

      - name: Upload Tauri release assets (macOS arm64)
        if: ${{ inputs.upload && inputs.tag != '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in packages/tauri-app/release-tauri/*.zip; do
            [ -f "$file" ] || continue
            echo "Uploading $file"
            gh release upload "$TAG" "$file" --clobber
          done

  build-tauri-windows:
    runs-on: windows-2025
    env:
      TAURI_UPDATER_PUBKEY: ${{ inputs.upload && inputs.tag != '' && secrets.TAURI_UPDATER_PUBKEY || '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable

      - name: Set workspace versions
        if: ${{ inputs.set_versions && inputs.version != '' }}
        run: npm version ${{ env.VERSION }} --workspaces --include-workspace-root --no-git-tag-version --allow-same-version
        shell: bash

      - name: Sync Tauri package version
        run: npm run sync:version --workspace @codenomad/tauri-app

      - name: Install dependencies
        run: npm ci --workspaces --include=optional

      - name: Prebuild (Tauri)
        run: npm run prebuild --workspace @codenomad/tauri-app

      - name: Verify bundled Node resource (Tauri Windows)
        run: node scripts/verify-bundled-node.cjs packages/tauri-app/src-tauri/resources@win32-x64

      - name: Configure Tauri updater (Windows)
        run: npm run configure:updater --workspace @codenomad/tauri-app

      - name: Build Windows bundle (Tauri)
        shell: bash
        working-directory: packages/tauri-app
        env:
          # Only this step holds the private key. Prebuild already ran without it,
          # so tauri.prebuilt.conf.json replaces the hook; cargo build scripts still see it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.upload && inputs.tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.upload && inputs.tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: npm exec -- tauri build --config src-tauri/tauri.prebuilt.conf.json

      - name: Package Tauri artifacts (Windows)
        if: ${{ inputs.upload || inputs.upload_actions_artifacts }}
        shell: pwsh
        run: |
          # The NSIS installer is both the download and the updater payload.
          $ErrorActionPreference = "Stop"
          $artifactDir = "packages/tauri-app/release-tauri"
          if (Test-Path $artifactDir) { Remove-Item $artifactDir -Recurse -Force }
          New-Item -ItemType Directory -Path $artifactDir | Out-Null
          $installers = @(Get-ChildItem -Path "packages/tauri-app/target/release/bundle/nsis" -File -Filter *.exe)
          if ($installers.Count -ne 1) { throw "Expected one Tauri NSIS installer, found $($installers.Count)" }
          $version = if ($env:VERSION) { $env:VERSION } else { (Get-Content packages/tauri-app/package.json | ConvertFrom-Json).version }
          Copy-Item $installers[0].FullName (Join-Path $artifactDir "CodeNomad-Tauri-windows-x64-$version.exe")

      - name: Stage and publish signed updater (Windows)
        env:
          UPDATER_UPLOAD: ${{ inputs.upload && inputs.tag != '' }}
        run: node packages/tauri-app/scripts/updater-artifacts.mjs stage windows-x86_64

      - name: Retain updater publication receipt (Windows)
        # Only release uploads publish a manifest; PR runs keep no receipt artifacts.
        if: ${{ inputs.upload && inputs.tag != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: updater-${{ github.run_id }}-windows-x86_64
          overwrite: true
          path: packages/tauri-app/release-updater/windows-x86_64.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Actions artifacts (Tauri Windows)
        if: ${{ inputs.upload_actions_artifacts }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.actions_artifacts_name_prefix }}tauri-windows
          path: packages/tauri-app/release-tauri/*.exe
          retention-days: ${{ inputs.actions_artifacts_retention_days }}
          if-no-files-found: warn

      - name: Upload Tauri release assets (Windows)
        if: ${{ inputs.upload && inputs.tag != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # A signed build already uploaded these exact bytes as the updater payload.
          $signed = (Get-Content packages/tauri-app/release-updater/windows-x86_64.json | ConvertFrom-Json).signed
          if (-not $signed) {
            Get-ChildItem -Path "packages/tauri-app/release-tauri" -Filter *.exe -File | ForEach-Object {
              Write-Host "Uploading $($_.FullName)"
              gh release upload $env:TAG $_.FullName --clobber
              if ($LASTEXITCODE -ne 0) { throw "Upload failed: $($_.Name)" }
            }
          }
          $assets = gh release view $env:TAG --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Could not list release assets" }
          $assets | Where-Object { $_ -like "CodeNomad-Tauri-windows-*.zip" } | ForEach-Object {
            Write-Host "Deleting obsolete Windows asset $_"
            gh release delete-asset $env:TAG $_ --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not delete obsolete asset: $_" }
          }

  build-tauri-linux:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      TAURI_UPDATER_PUBKEY: ${{ inputs.upload && inputs.tag != '' && secrets.TAURI_UPDATER_PUBKEY || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set workspace versions
        if: ${{ inputs.set_versions && inputs.version != '' }}
        run: npm version ${VERSION} --workspaces --include-workspace-root --no-git-tag-version --allow-same-version

      - name: Sync Tauri package version
        run: npm run sync:version --workspace @codenomad/tauri-app

      # The updater is enabled only when a verifiable public key is available.
      # Its private half stays in a repository secret that an administrator
      # adds, so an unsigned build never advertises an update it cannot verify.
      - name: Configure Tauri updater
        run: npm run configure:updater --workspace @codenomad/tauri-app

      - name: Install dependencies
        run: npm ci --workspaces --include=optional

      - name: Prebuild (Tauri)
        run: npm run prebuild --workspace @codenomad/tauri-app

      - name: Verify bundled Node resource (Tauri Linux)
        run: node scripts/verify-bundled-node.cjs packages/tauri-app/src-tauri/resources@linux-x64

      # Linux Tauri ships only the self-updating AppImage; the deb comes from Electron.
      - name: Build AppImage (Tauri)
        working-directory: packages/tauri-app
        env:
          # Only this step holds the private key. Prebuild already ran without it,
          # so tauri.prebuilt.conf.json replaces the hook; cargo build scripts still see it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.upload && inputs.tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.upload && inputs.tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # Run the bundling tools in extraction mode without requiring FUSE.
          # --verbose retains linuxdeploy diagnostics if packaging fails.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm exec -- tauri build --bundles appimage --verbose --config src-tauri/tauri.prebuilt.conf.json

      - name: Package and verify Tauri AppImage
        if: ${{ inputs.upload || inputs.upload_actions_artifacts }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="packages/tauri-app/target/release/bundle/appimage"
          ARTIFACT_DIR="packages/tauri-app/release-tauri"
          VERSION_TO_USE="${VERSION:-}"
          if [ -z "$VERSION_TO_USE" ]; then
            VERSION_TO_USE=$(node -p "require('./packages/tauri-app/package.json').version")
          fi
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          shopt -s nullglob

          appimages=("$BUNDLE_ROOT"/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "Expected one Tauri AppImage under $BUNDLE_ROOT, found ${#appimages[@]}" >&2
            exit 1
          fi

          artifact="$(pwd)/$ARTIFACT_DIR/CodeNomad-Tauri-linux-x64-${VERSION_TO_USE}.AppImage"
          cp "${appimages[0]}" "$artifact"
          chmod 0755 "$artifact"

          # linuxdeploy must have produced a self-contained image with the runtime
          # and the bundled server reachable from AppRun.
          extract_dir=$(mktemp -d)
          trap 'rm -rf "$extract_dir"' EXIT
          (cd "$extract_dir" && "$artifact" --appimage-extract >/dev/null)
          root="$extract_dir/squashfs-root"
          for required in AppRun usr/bin/codenomad-tauri \
            usr/lib/CodeNomad/resources/node/linux-x64/bin/node \
            usr/lib/CodeNomad/resources/server/dist/bin.js \
            usr/lib/CodeNomad/resources/ui-loading/loading.html; do
            if [ ! -e "$root/$required" ]; then
              echo "Missing path in Tauri AppImage: $required" >&2
              exit 1
            fi
          done
          binary="$root/usr/bin/codenomad-tauri"
          if [ ! -x "$root/AppRun" ] || [ ! -x "$binary" ]; then
            echo "Tauri AppImage entry point is not executable" >&2
            exit 1
          fi
          desktop_entries=$(find "$root" -maxdepth 1 -name '*.desktop' | wc -l)
          if [ "$desktop_entries" -ne 1 ]; then
            echo "Expected exactly one desktop entry in the Tauri AppImage, found $desktop_entries" >&2
            exit 1
          fi
          node scripts/smoke-packaged-resources.cjs \
            --resources "$root/usr/lib/CodeNomad/resources" \
            --loading "$root/usr/lib/CodeNomad/resources/ui-loading" \
            --target linux-x64

          LD_LIBRARY_PATH="$root/usr/lib:$root/usr/lib/x86_64-linux-gnu" \
            ldd "$binary" | tee /tmp/codenomad-tauri-appimage-ldd.txt
          if grep -q "not found" /tmp/codenomad-tauri-appimage-ldd.txt; then
            echo "Tauri AppImage binary has unresolved shared libraries" >&2
            exit 1
          fi

          # An AppImage built on a recent base raises the glibc it needs, which
          # silently excludes older distributions. Report the floor instead of
          # leaving it for a user to discover, and keep the job log comparable
          # between releases. objdump prints the version bare, and GLIBCXX_ and
          # GLIBC_PRIVATE must not be mistaken for a glibc floor.
          glibc_floor=$(objdump -T "$binary" \
            | sed -n 's/.*GLIBC_\([0-9][0-9.]*\).*/\1/p' \
            | sort -V | tail -n 1)
          if [ -z "$glibc_floor" ]; then
            echo "Could not determine the GLIBC floor of the Tauri AppImage" >&2
            exit 1
          fi
          echo "Tauri AppImage requires GLIBC_${glibc_floor} or newer"
          echo "GLIBC_${glibc_floor}" > "$ARTIFACT_DIR/appimage-glibc-floor.txt"

      - name: Stage and publish signed updater (Linux)
        env:
          UPDATER_UPLOAD: ${{ inputs.upload && inputs.tag != '' }}
        run: node packages/tauri-app/scripts/updater-artifacts.mjs stage linux-x86_64

      - name: Retain updater publication receipt (Linux)
        # Only release uploads publish a manifest; PR runs keep no receipt artifacts.
        if: ${{ inputs.upload && inputs.tag != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: updater-${{ github.run_id }}-linux-x86_64
          overwrite: true
          path: packages/tauri-app/release-updater/linux-x86_64.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Actions artifacts (Tauri Linux)
        if: ${{ inputs.upload_actions_artifacts }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.actions_artifacts_name_prefix }}tauri-linux
          path: packages/tauri-app/release-tauri/*.AppImage
          retention-days: ${{ inputs.actions_artifacts_retention_days }}
          if-no-files-found: error

      - name: Upload Tauri release assets (Linux)
        if: ${{ inputs.upload && inputs.tag != '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(packages/tauri-app/release-tauri/*.AppImage)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected the Tauri Linux AppImage, found ${#files[@]}" >&2
            exit 1
          fi

          for file in "${files[@]}"; do
            asset_name=$(basename "$file")
            echo "Uploading $file"
            gh release upload "$TAG" "$file" --clobber
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq -- "$asset_name"; then
              echo "Uploaded Tauri Linux asset is missing from release: $asset_name" >&2
              exit 1
            fi
          done

          gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            case "$asset" in
              CodeNomad-Tauri-linux-*.deb|CodeNomad-Tauri-linux-*.zip|CodeNomad-Tauri-linux-*.rpm|CodeNomad-Tauri-linux-*.flatpak)
                echo "Deleting obsolete Linux asset $asset"
                gh release delete-asset "$TAG" "$asset" --yes
                ;;
            esac
          done

  publish-tauri-updater:
    needs: [build-tauri-windows, build-tauri-macos, build-tauri-macos-arm64, build-tauri-linux]
    if: ${{ inputs.upload && inputs.tag != '' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: updater-${{ github.run_id }}-*
          path: updater-receipts
          merge-multiple: true
      - name: Publish complete updater manifest after all platform uploads
        run: node packages/tauri-app/scripts/updater-artifacts.mjs publish updater-receipts

  build-tauri-linux-arm64:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: linux/arm64

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Linux build dependencies (Tauri)
        run: |
          sudo dpkg --add-architecture arm64
          sudo tee /etc/apt/sources.list.d/arm64.list >/dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-backports main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libgtk-3-dev:arm64 \
            libglib2.0-dev:arm64 \
            libwebkit2gtk-4.1-dev:arm64 \
            libsoup-3.0-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64

      - name: Set workspace versions
        run: npm version ${VERSION} --workspaces --include-workspace-root --no-git-tag-version --allow-same-version

      - name: Sync Tauri package version
        run: npm run sync:version --workspace @codenomad/tauri-app

      - name: Install dependencies
        run: npm ci --workspaces --include=optional

      - name: Build Linux bundle (Tauri arm64)
        env:
          CODENOMAD_NODE_TARGET: linux-arm64
          TAURI_BUILD_TARGET: aarch64-unknown-linux-gnu
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: npm run build --workspace @codenomad/tauri-app

      - name: Package Tauri artifacts (Linux arm64)
        run: |
          set -euo pipefail
          SEARCH_ROOT="packages/tauri-app/target"
          ARTIFACT_DIR="packages/tauri-app/release-tauri"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          shopt -s nullglob globstar
          first_artifact=$(find "$SEARCH_ROOT" -type f \( -name "*.AppImage" -o -name "*.tar.gz" \) | head -n1)
          fallback_bin="$SEARCH_ROOT/release/codenomad-tauri"
          if [ -n "$first_artifact" ]; then
            zip -j "$ARTIFACT_DIR/CodeNomad-Tauri-linux-arm64-${VERSION}.zip" "$first_artifact"
          elif [ -f "$fallback_bin" ]; then
            zip -j "$ARTIFACT_DIR/CodeNomad-Tauri-linux-arm64-${VERSION}.zip" "$fallback_bin"
          else
            echo "No bundled artifact found under $SEARCH_ROOT and no binary at $fallback_bin" >&2
            exit 1
          fi


      - name: Upload Tauri release assets (Linux arm64)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in packages/tauri-app/release-tauri/*.zip; do
            [ -f "$file" ] || continue
            echo "Uploading $file"
            gh release upload "$TAG" "$file" --clobber
          done
