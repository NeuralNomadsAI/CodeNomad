name: OpenCode V2 Pre-Release

on:
  schedule:
    # Nightly build of DEV-v2 (only if its current commit has not been released).
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  statuses: write

concurrency:
  group: dev-v2-prerelease
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      dev_v2_sha: ${{ steps.gate.outputs.dev_v2_sha }}
      version_suffix: ${{ steps.gate.outputs.version_suffix }}
    steps:
      - name: Decide whether to run
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DEV_V2_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/DEV-v2" --jq '.object.sha')
          if [ -z "$DEV_V2_SHA" ] || [ "$DEV_V2_SHA" = "null" ]; then
            echo "Failed to resolve DEV-v2 head SHA" >&2
            exit 1
          fi

          DATE=$(date -u +%Y%m%d)
          SHA8="${DEV_V2_SHA::8}"
          VERSION_SUFFIX="-dev-v2-${DATE}-${SHA8}"
          SHOULD_RUN="true"
          PUBLISHED="false"
          VERSIONS=$(npm view "@neuralnomads/codenomad-dev" versions --json)
          if [ -n "$VERSIONS" ]; then
            PUBLISHED=$(jq --arg suffix "-${SHA8}" 'if type == "array" then any(.[]; endswith($suffix)) else endswith($suffix) end' <<< "$VERSIONS")
          fi

          if [ "$PUBLISHED" = "true" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${DEV_V2_SHA}" \
              -f state=success \
              -f context=codenomad/dev-v2-release \
              -f description="OpenCode V2 prerelease published" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            SHOULD_RUN="false"
          elif [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            SUCCEEDED=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEV_V2_SHA}/status" --jq '[.statuses[] | select(.context == "codenomad/dev-v2-release" and .state == "success")] | length')
            if [ "$SUCCEEDED" -gt 0 ]; then
              SHOULD_RUN="false"
            else
              gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq ".[] | select(.prerelease == true and (.tag_name | startswith(\"v0.20.0-dev-v2-\")) and (.tag_name | endswith(\"-${SHA8}\"))) | .tag_name" |
                while read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true; done
            fi
          fi

          echo "run=${SHOULD_RUN}" >> "$GITHUB_OUTPUT"
          echo "dev_v2_sha=${DEV_V2_SHA}" >> "$GITHUB_OUTPUT"
          echo "version_suffix=${VERSION_SUFFIX}" >> "$GITHUB_OUTPUT"

  prerelease:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    uses: ./.github/workflows/reusable-release.yml
    with:
      ref: ${{ needs.gate.outputs.dev_v2_sha }}
      base_version: 0.20.0
      version_suffix: ${{ needs.gate.outputs.version_suffix }}
      npm_package_name: "@neuralnomads/codenomad-dev"
      dist_tag: v2
      prerelease: true
      release_ui: false
    secrets: inherit

  mark-success:
    needs: [gate, prerelease]
    runs-on: ubuntu-latest
    steps:
      - name: Mark released commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.gate.outputs.dev_v2_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=success \
            -f context=codenomad/dev-v2-release \
            -f description="OpenCode V2 prerelease published" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
