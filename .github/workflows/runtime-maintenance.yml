name: Bundled Runtime Maintenance

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundled-runtime-maintenance
  cancel-in-progress: false

jobs:
  check:
    # Never run maintenance code from a manually selected branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pin: ${{ steps.runtime.outputs.pin }}
      target: ${{ steps.runtime.outputs.target }}
      node-update: ${{ steps.runtime.outputs.node-update }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Test maintenance policy
        run: node --test .github/scripts/runtime-maintenance.test.cjs
      - name: Check Node LTS and audit the bundled npm release
        id: runtime
        run: npm run check:runtime
      - name: Retain the npm advisory report for manual assessment
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bundled-npm-audit
          path: ${{ runner.temp }}/bundled-npm-audit.json
          retention-days: 7
          if-no-files-found: error

  propose:
    needs: check
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.check.outputs.node-update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Propose a reviewed Node LTS update
        uses: actions/github-script@v9.0.0
        env:
          NODE_PIN: ${{ needs.check.outputs.pin }}
          NODE_TARGET: ${{ needs.check.outputs.target }}
        with:
          script: |
            const { proposeNodeUpdate } = require('./.github/scripts/runtime-maintenance.cjs');
            await proposeNodeUpdate({ github, context, core, pin: process.env.NODE_PIN, target: process.env.NODE_TARGET });
