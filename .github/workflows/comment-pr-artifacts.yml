name: Comment PR Artifacts

on:
  workflow_run:
    workflows: [PR Build Validation]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  comment:
    runs-on: ubuntu-latest
    # A failed validation remains red in its own workflow, not a second
    # misleading failure in a helper with no artifacts to announce.
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout trusted default-branch helper only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Comment completed PR build artifacts
        uses: actions/github-script@v8
        env:
          ALLOWED_ACTORS: ${{ vars.ALLOWED_NON_DEV_PR_ACTORS }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { commentPRArtifacts } = require('./.github/scripts/comment-pr-artifacts.cjs');
            await commentPRArtifacts({ github, context, core, allowedActors: process.env.ALLOWED_ACTORS });
