[workspace]
resolver = "3"
members = ["packages/rune-app", "crates/codenomad-client", "crates/rune-theme-codenomad", "crates/codenomad-host-process", "crates/rune-style-policy"]
exclude = ["packages/server-rs"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "21e5342b9a4cc33eeee88071b4b1f0eafb1247d4", default-features = false, features = ["embedded-fonts", "accessibility", "tooling", "segmenter-dictionaries"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "21e5342b9a4cc33eeee88071b4b1f0eafb1247d4", default-features = false }
serde_json = "1"
codenomad-client = { path = "crates/codenomad-client" }
rune-theme-codenomad = { path = "crates/rune-theme-codenomad" }

[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "21e5342b9a4cc33eeee88071b4b1f0eafb1247d4" }
winit = { git = "https://github.com/anomalyco/rune", rev = "21e5342b9a4cc33eeee88071b4b1f0eafb1247d4" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "21e5342b9a4cc33eeee88071b4b1f0eafb1247d4" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "21e5342b9a4cc33eeee88071b4b1f0eafb1247d4" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "21e5342b9a4cc33eeee88071b4b1f0eafb1247d4" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "21e5342b9a4cc33eeee88071b4b1f0eafb1247d4" }

[profile.dev]
debug = 0
