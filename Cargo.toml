[workspace]
resolver = "3"
members = ["packages/rune-app", "crates/codenomad-client", "crates/rune-theme-codenomad", "crates/codenomad-host-process", "crates/codenomad-windows-notifications", "crates/codenomad-windows-install", "crates/codenomad-rune-setup", "crates/rune-style-policy"]
exclude = ["packages/server-rs"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "99811fa653d384a0096dbeab25c0d1a36c47973d", default-features = false, features = ["embedded-fonts", "accessibility", "tooling", "segmenter-dictionaries", "svg", "avif"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "99811fa653d384a0096dbeab25c0d1a36c47973d", default-features = false, features = ["markdown", "mermaid"] }
serde_json = "1"
codenomad-client = { path = "crates/codenomad-client" }
rune-theme-codenomad = { path = "crates/rune-theme-codenomad" }

[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "99811fa653d384a0096dbeab25c0d1a36c47973d" }
naga = { git = "https://github.com/anomalyco/rune", rev = "99811fa653d384a0096dbeab25c0d1a36c47973d" }
winit = { git = "https://github.com/anomalyco/rune", rev = "99811fa653d384a0096dbeab25c0d1a36c47973d" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "99811fa653d384a0096dbeab25c0d1a36c47973d" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "99811fa653d384a0096dbeab25c0d1a36c47973d" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "99811fa653d384a0096dbeab25c0d1a36c47973d" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "99811fa653d384a0096dbeab25c0d1a36c47973d" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "99811fa653d384a0096dbeab25c0d1a36c47973d" }

[profile.dev]
debug = 0

[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
