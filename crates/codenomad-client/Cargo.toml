[package]
name = "codenomad-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "=0.10.9"
async-channel = "2.5"
futures-lite = "2.6"
imagesize = "0.13"
web-time = "1.1"
time = { version = "0.3", default-features = false, features = ["parsing"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
avif-parse = "=2.1.0"
bitreader = "0.3"
getrandom = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "cookies", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "EventTarget", "VisibilityState", "Location", "Crypto", "EventSource", "EventSourceInit", "MessageEvent", "Event", "AbortController", "AbortSignal", "Headers", "ReadableStream", "ReadableStreamDefaultReader", "ReferrerPolicy", "Request", "RequestCredentials", "RequestInit", "Response"] }
