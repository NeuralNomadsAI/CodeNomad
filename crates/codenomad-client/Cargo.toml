[package]
name = "codenomad-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
async-channel = "2.5"
futures-lite = "2.6"
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "cookies"] }
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Crypto", "EventSource", "EventSourceInit", "MessageEvent", "Event"] }
