[package]
name = "codenomad-desktop-updater"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
semver = "1"
serde_json = "1"
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
codenomad-windows-install = { path = "../codenomad-windows-install" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util"] }
