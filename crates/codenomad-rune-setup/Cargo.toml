[package]
name = "codenomad-rune-setup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
codenomad-windows-install = { path = "../codenomad-windows-install" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

# Evaluated against the host: the resource compiler only exists on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
